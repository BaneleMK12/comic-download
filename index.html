<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangaScraper - Download Manager</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --accent: #00d4ff;
            --accent-hover: #00a3cc;
            --error: #ff4d4d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: white;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 12px 24px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: var(--accent-hover); }
        button:disabled { background: #555; cursor: not-allowed; }

        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
            font-weight: bold;
            word-break: break-word;
        }

        .success { background: rgba(0, 212, 255, 0.1); color: var(--accent); border: 1px solid var(--accent); }
        .error { background: rgba(255, 77, 77, 0.1); color: var(--error); border: 1px solid var(--error); }

        #results { margin-top: 20px; display: none; }

        .results-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .chapter-list { list-style: none; padding: 0; }

        .chapter-item {
            background: #2a2a2a;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-left: 4px solid var(--accent);
        }

        .download-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 16px;
            font-size: 14px;
            min-width: 110px;
        }

        .download-btn:hover { background: var(--accent); color: #000; }
        .download-btn:disabled { background: transparent; color: #888; border-color: #555; }

        .small-btn { min-width: 0; padding: 6px 12px; font-size: 12px; }

        .actions { display: flex; gap: 8px; align-items: center; }

        .cancel-btn {
            display: none;
            min-width: 0;
            padding: 8px 12px;
            border-color: var(--error);
            color: var(--error);
        }
        .cancel-btn:hover { background: var(--error); color: #000; }

        .option-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        select {
            padding: 8px 10px;
            background: #2a2a2a;
            color: white;
            border: 1px solid #333;
            border-radius: 5px;
            font-size: 14px;
        }

        .loader {
            border: 4px solid #333;
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 0 auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <h1>MangaScraper</h1>

    <div class="container">
        <div class="input-group">
            <input type="text" id="mangaUrl" placeholder="Paste Manga Series or Chapter URL" value="https://vortexscans.org/series/became-the-patron-of-villains">
            <button id="fetchBtn">Fetch</button>
        </div>

        <div class="option-row">
            <label for="quality">PDF quality</label>
            <select id="quality">
                <option value="1">100% (Original)</option>
                <option value="0.9">90%</option>
                <option value="0.7">70%</option>
                <option value="0.5">50%</option>
            </select>
        </div>

        <div id="loader" class="loader"></div>
        <div id="status"></div>

        <div id="results">
            <div class="results-head">
                <h3>Available Chapters</h3>
                <button id="clearBtn" class="download-btn small-btn">Clear saved</button>
            </div>
            <ul id="chapterList" class="chapter-list"></ul>
        </div>
    </div>

    <script>
        // CONFIGURATION: must match your deployed Worker URL exactly
        const PROXY_API_URL = 'https://comic-download.makhanyabanele12.workers.dev';
        const PARALLEL_IMAGES = 8;       // images downloaded at once
        const MAX_PDF_DIM = 14400;       // PDF page size limit (points)
        const STATE_KEY = 'ms_state_v1';

        // ---------- Saved state (survives closing / killing the browser) ----------
        // localStorage: the chapter list + which chapters are finished.
        // IndexedDB: page images of chapters that are partly downloaded (for Resume).
        let state = { url: '', title: '', chapters: [] };
        const buttons = new Map(); // chapter url -> button

        // Finished chapters, remembered for EVERY series you've used (chapter URLs are unique)
        const DONE_KEY = 'ms_done_v1';
        let doneMap = {};

        function saveDone() {
            try { localStorage.setItem(DONE_KEY, JSON.stringify(doneMap)); } catch (e) {}
        }

        function loadDone() {
            try { doneMap = JSON.parse(localStorage.getItem(DONE_KEY) || '{}') || {}; } catch (e) { doneMap = {}; }
        }

        function saveState() {
            try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch (e) {}
        }

        function loadState() {
            try {
                const s = JSON.parse(localStorage.getItem(STATE_KEY) || 'null');
                if (s && Array.isArray(s.chapters)) {
                    state = { url: s.url || '', title: s.title || '', chapters: s.chapters };
                    // Carry over Done marks saved by the previous version
                    if (s.done && Object.keys(s.done).length) {
                        Object.assign(doneMap, s.done);
                        saveDone();
                        saveState();
                    }
                }
            } catch (e) {}
        }

        const dbPromise = new Promise(resolve => {
            try {
                const req = indexedDB.open('mangascraper', 1);
                req.onupgradeneeded = () => {
                    req.result.createObjectStore('pages');
                    req.result.createObjectStore('meta');
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(null);
            } catch (e) { resolve(null); }
        });

        // Never throws: if IndexedDB is unavailable, downloads still work, just without Resume.
        async function idb(storeName, mode, fn) {
            try {
                const db = await dbPromise;
                if (!db) return undefined;
                return await new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, mode);
                    const req = fn(tx.objectStore(storeName));
                    tx.oncomplete = () => resolve(req ? req.result : undefined);
                    tx.onerror = () => reject(tx.error);
                    tx.onabort = () => reject(tx.error);
                });
            } catch (e) { return undefined; }
        }

        const savePage   = (url, i, blob) => idb('pages', 'readwrite', s => s.put(blob, [url, i]));
        const getPage    = (url, i)       => idb('pages', 'readonly',  s => s.get([url, i]));
        const countPages = (url)          => idb('pages', 'readonly',  s => s.count(IDBKeyRange.bound([url, 0], [url, Infinity])));
        const saveMeta   = (url, images)  => idb('meta',  'readwrite', s => s.put(images, url));
        const getMeta    = (url)          => idb('meta',  'readonly',  s => s.get(url));

        async function clearChapterCache(url) {
            await idb('pages', 'readwrite', s => s.delete(IDBKeyRange.bound([url, 0], [url, Infinity])));
            await idb('meta', 'readwrite', s => s.delete(url));
        }

        async function clearAllCache() {
            await idb('pages', 'readwrite', s => s.clear());
            await idb('meta', 'readwrite', s => s.clear());
        }

        // ---------- UI ----------
        document.getElementById('fetchBtn').addEventListener('click', fetchChapters);

        // Remember the chosen quality
        const qualityEl = document.getElementById('quality');
        try {
            const q = localStorage.getItem('ms_quality');
            if (q && [...qualityEl.options].some(o => o.value === q)) qualityEl.value = q;
        } catch (e) {}
        qualityEl.addEventListener('change', () => {
            try { localStorage.setItem('ms_quality', qualityEl.value); } catch (e) {}
        });

        document.getElementById('clearBtn').addEventListener('click', async () => {
            if (!confirm('Clear the saved chapter list, download history (Done marks) and any partly downloaded pages?')) return;
            try { localStorage.removeItem(STATE_KEY); localStorage.removeItem(DONE_KEY); } catch (e) {}
            await clearAllCache();
            doneMap = {};
            state = { url: '', title: '', chapters: [] };
            buttons.clear();
            document.getElementById('chapterList').innerHTML = '';
            document.getElementById('results').style.display = 'none';
            document.getElementById('status').style.display = 'none';
        });

        async function fetchChapters() {
            const urlInput = document.getElementById('mangaUrl').value.trim();
            const btn = document.getElementById('fetchBtn');
            const loader = document.getElementById('loader');
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');
            const list = document.getElementById('chapterList');

            if (!urlInput) {
                showStatus('Please enter a valid URL.', 'error');
                return;
            }

            btn.disabled = true;
            loader.style.display = 'block';
            statusDiv.style.display = 'none';
            resultsDiv.style.display = 'none';
            list.innerHTML = '';

            try {
                const response = await fetch(`${PROXY_API_URL}/scrape`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });

                if (!response.ok) {
                    const errText = await response.text().catch(() => 'No text');
                    throw new Error(`Server Error: ${response.status} - ${errText}`);
                }

                const data = await response.json();

                if (data.success && Array.isArray(data.chapters) && data.chapters.length > 0) {
                    state = {
                        url: urlInput,
                        title: data.title,
                        chapters: data.chapters
                    };
                    saveState();
                    renderChapters(data.chapters, data.title);
                    showStatus(`Found ${data.chapters.length} chapters for ${data.title}`, 'success');
                } else {
                    throw new Error(data.error || 'No chapters found or invalid response structure');
                }

            } catch (error) {
                console.error('Detailed Error:', error);
                let msg = error.message;
                if (msg.includes('Failed to fetch')) {
                    msg = 'Failed to fetch. Check that the Worker URL is correct and the Worker is deployed.';
                }
                showStatus(`Error: ${msg}`, 'error');
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }

        function renderChapters(chapters, title) {
            const resultsDiv = document.getElementById('results');
            const list = document.getElementById('chapterList');
            list.innerHTML = '';
            buttons.clear();

            chapters.forEach((chapter, index) => {
                const li = document.createElement('li');
                li.className = 'chapter-item';

                const label = document.createElement('span');
                label.textContent = `${index + 1}. ${chapter.title}`;

                const btn = document.createElement('button');
                btn.className = 'download-btn';
                btn.textContent = doneMap[chapter.url] ? 'Done ✓' : 'Download';
                btn.addEventListener('click', () => {
                    // Already downloaded? Ask before saving a second copy.
                    if (btn.textContent === 'Done ✓' &&
                        !confirm(`${chapter.title} was already downloaded. Download it again?`)) return;
                    downloadChapter(title, chapter, btn);
                });
                buttons.set(chapter.url, btn);

                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'download-btn cancel-btn';
                cancelBtn.textContent = 'Cancel';
                btn._cancelBtn = cancelBtn;

                const actions = document.createElement('div');
                actions.className = 'actions';
                actions.appendChild(cancelBtn);
                actions.appendChild(btn);

                li.appendChild(label);
                li.appendChild(actions);
                list.appendChild(li);
            });

            resultsDiv.style.display = 'block';
            markResumable();
        }

        // Show "Resume 6/14" on chapters that were partly downloaded before the browser closed
        async function markResumable() {
            const urls = await idb('meta', 'readonly', s => s.getAllKeys());
            if (!urls) return;
            for (const url of urls) {
                const btn = buttons.get(url);
                if (!btn || btn.disabled) continue;
                const meta = await getMeta(url);
                const n = await countPages(url);
                if (meta && n > 0 && !btn.disabled) btn.textContent = `Resume ${n}/${meta.length}`;
            }
        }

        // Turn a downloaded image blob into a pdf-lib image.
        // quality 1 (Original): JPEG and PNG are embedded untouched; WebP/AVIF must be
        //   converted, so they're re-encoded to JPEG at 92%.
        // quality < 1: every page is re-encoded to JPEG at that quality (smaller file).
        async function embedImage(pdfDoc, blob, quality) {
            const bytes = new Uint8Array(await blob.arrayBuffer());
            const isJpg = bytes[0] === 0xFF && bytes[1] === 0xD8;
            const isPng = bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4E && bytes[3] === 0x47;

            if (quality >= 1) {
                if (isJpg) return pdfDoc.embedJpg(bytes);
                if (isPng) return pdfDoc.embedPng(bytes);
            }

            try {
                const bmp = await createImageBitmap(blob);
                const canvas = document.createElement('canvas');
                canvas.width = bmp.width;
                canvas.height = bmp.height;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(bmp, 0, 0);
                if (bmp.close) bmp.close();
                const jpg = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality >= 1 ? 0.92 : quality));
                canvas.width = canvas.height = 0; // free memory
                if (!jpg) throw new Error('Could not re-encode a page');
                return await pdfDoc.embedJpg(new Uint8Array(await jpg.arrayBuffer()));
            } catch (e) {
                // If re-encoding fails (e.g. very large page), fall back to the original bytes
                if (isJpg) return pdfDoc.embedJpg(bytes);
                if (isPng) return pdfDoc.embedPng(bytes);
                throw e;
            }
        }

        async function downloadChapter(mangaTitle, chapter, btn) {
            if (typeof PDFLib === 'undefined') {
                showStatus('Error: the PDF library failed to load. Check your connection and reload the page.', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Starting...';
            let total = 0, done = 0;

            const quality = parseFloat(qualityEl.value) || 1;   // fixed for this download
            const controller = new AbortController();
            const signal = controller.signal;
            const cancelBtn = btn._cancelBtn;
            if (cancelBtn) {
                cancelBtn.style.display = 'inline-block';
                cancelBtn.disabled = false;
                cancelBtn.onclick = () => {
                    cancelBtn.disabled = true;
                    cancelBtn.textContent = 'Cancelling...';
                    controller.abort();
                };
            }

            try {
                // 1. Page list: reuse the saved one when resuming, otherwise ask the Worker
                let images = await getMeta(chapter.url);
                if (!images || !images.length) {
                    const res = await fetch(`${PROXY_API_URL}/images`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: chapter.url }),
                        signal
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok || !data.success) {
                        throw new Error(data.error || `Server Error: ${res.status}`);
                    }
                    images = data.images;
                    await saveMeta(chapter.url, images);
                }
                total = images.length;

                // 2. Download pages several at a time; each finished page is saved to IndexedDB,
                //    so a closed/killed browser can pick up from the pages already stored.
                const blobs = new Array(images.length);
                let next = 0;
                btn.textContent = `0/${total}`;

                async function runner() {
                    while (true) {
                        if (signal.aborted) return;
                        const i = next++;
                        if (i >= images.length) return;

                        const cached = await getPage(chapter.url, i);
                        if (cached) {
                            blobs[i] = cached;
                        } else {
                            const r = await fetch(`${PROXY_API_URL}/img?u=${encodeURIComponent(images[i])}`, { signal });
                            if (!r.ok) throw new Error(`Page ${i + 1} failed (status ${r.status})`);
                            blobs[i] = await r.blob();
                            await savePage(chapter.url, i, blobs[i]);
                        }
                        done++;
                        btn.textContent = `${done}/${total}`;
                    }
                }
                await Promise.all(Array.from({ length: PARALLEL_IMAGES }, runner));
                if (signal.aborted) throw new DOMException('Cancelled', 'AbortError');

                // 3. Build the PDF: one page per image, page size = image size
                const pdfDoc = await PDFLib.PDFDocument.create();
                for (let i = 0; i < blobs.length; i++) {
                    if (signal.aborted) throw new DOMException('Cancelled', 'AbortError');
                    btn.textContent = `PDF ${i + 1}/${blobs.length}`;
                    const img = await embedImage(pdfDoc, blobs[i], quality);
                    blobs[i] = null; // release memory as we go

                    let w = img.width, h = img.height;
                    const scale = Math.min(1, MAX_PDF_DIM / Math.max(w, h));
                    w *= scale; h *= scale;

                    const page = pdfDoc.addPage([w, h]);
                    page.drawImage(img, { x: 0, y: 0, width: w, height: h });
                }

                const safe = s => s.replace(/[\\/:*?"<>|]+/g, '').trim();
                pdfDoc.setTitle(`${safe(mangaTitle)} - ${safe(chapter.title)}`);

                btn.textContent = 'Saving...';
                const pdfBytes = await pdfDoc.save();
                const pdfBlob = new Blob([pdfBytes], { type: 'application/pdf' });

                const a = document.createElement('a');
                a.href = URL.createObjectURL(pdfBlob);
                a.download = `${safe(mangaTitle)} - ${safe(chapter.title)}.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 60000);

                // Finished: remember it and free the stored pages
                doneMap[chapter.url] = true;
                saveDone();
                await clearChapterCache(chapter.url);

                btn.textContent = 'Done ✓';
                showStatus(`Downloaded ${chapter.title} (${images.length} pages) as PDF`, 'success');
            } catch (err) {
                const cancelled = signal.aborted || err.name === 'AbortError';
                if (!cancelled) console.error(err);
                const stored = (await countPages(chapter.url)) || 0;
                if (stored > 0 && total) btn.textContent = `Resume ${stored}/${total}`;
                else if (cancelled) btn.textContent = doneMap[chapter.url] ? 'Done ✓' : 'Download';
                else btn.textContent = 'Retry';

                if (cancelled) {
                    showStatus(stored > 0
                        ? `Cancelled ${chapter.title}. ${stored} pages are saved, tap Resume to continue.`
                        : `Cancelled ${chapter.title}.`, 'success');
                } else {
                    showStatus(`Download failed: ${err.message}`, 'error');
                }
            } finally {
                btn.disabled = false;
                if (cancelBtn) {
                    cancelBtn.style.display = 'none';
                    cancelBtn.textContent = 'Cancel';
                    cancelBtn.onclick = null;
                }
            }
        }

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = type;
            el.style.display = 'block';
        }

        // ---------- Restore the last session on open ----------
        loadDone();
        loadState();
        if (state.chapters.length) {
            if (state.url) document.getElementById('mangaUrl').value = state.url;
            renderChapters(state.chapters, state.title);
            showStatus(`Restored ${state.chapters.length} chapters for ${state.title}`, 'success');
        }
    </script>
</body>
</html>
