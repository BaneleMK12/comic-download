<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangaScraper - Download Manager</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --accent: #00d4ff;
            --accent-hover: #00a3cc;
            --error: #ff4d4d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: white;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 12px 24px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: var(--accent-hover); }
        button:disabled { background: #555; cursor: not-allowed; }

        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
            font-weight: bold;
            word-break: break-word;
        }

        .success { background: rgba(0, 212, 255, 0.1); color: var(--accent); border: 1px solid var(--accent); }
        .error { background: rgba(255, 77, 77, 0.1); color: var(--error); border: 1px solid var(--error); }

        #results { margin-top: 20px; display: none; }

        .chapter-list { list-style: none; padding: 0; }

        .chapter-item {
            background: #2a2a2a;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-left: 4px solid var(--accent);
        }

        .download-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 16px;
            font-size: 14px;
            min-width: 110px;
        }

        .download-btn:hover { background: var(--accent); color: #000; }
        .download-btn:disabled { background: transparent; color: #888; border-color: #555; }

        .loader {
            border: 4px solid #333;
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 0 auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <h1>MangaScraper</h1>

    <div class="container">
        <div class="input-group">
            <input type="text" id="mangaUrl" placeholder="Paste Manga Series or Chapter URL" value="https://vortexscans.org/series/became-the-patron-of-villains">
            <button id="fetchBtn">Fetch</button>
        </div>

        <div id="loader" class="loader"></div>
        <div id="status"></div>

        <div id="results">
            <h3>Available Chapters</h3>
            <ul id="chapterList" class="chapter-list"></ul>
        </div>
    </div>

    <script>
        // CONFIGURATION: must match your deployed Worker URL exactly
        const PROXY_API_URL = 'https://comic-download.makhanyabanele12.workers.dev';
        const PARALLEL_IMAGES = 4;

        document.getElementById('fetchBtn').addEventListener('click', fetchChapters);

        async function fetchChapters() {
            const urlInput = document.getElementById('mangaUrl').value.trim();
            const btn = document.getElementById('fetchBtn');
            const loader = document.getElementById('loader');
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');
            const list = document.getElementById('chapterList');

            if (!urlInput) {
                showStatus('Please enter a valid URL.', 'error');
                return;
            }

            btn.disabled = true;
            loader.style.display = 'block';
            statusDiv.style.display = 'none';
            resultsDiv.style.display = 'none';
            list.innerHTML = '';

            try {
                const response = await fetch(`${PROXY_API_URL}/scrape`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });

                if (!response.ok) {
                    const errText = await response.text().catch(() => 'No text');
                    throw new Error(`Server Error: ${response.status} - ${errText}`);
                }

                const data = await response.json();

                if (data.success && Array.isArray(data.chapters) && data.chapters.length > 0) {
                    renderChapters(data.chapters, data.title);
                    showStatus(`Found ${data.chapters.length} chapters for ${data.title}`, 'success');
                } else {
                    throw new Error(data.error || 'No chapters found or invalid response structure');
                }

            } catch (error) {
                console.error('Detailed Error:', error);
                let msg = error.message;
                if (msg.includes('Failed to fetch')) {
                    msg = 'Failed to fetch. Check that the Worker URL is correct and the Worker is deployed.';
                }
                showStatus(`Error: ${msg}`, 'error');
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }

        function renderChapters(chapters, title) {
            const resultsDiv = document.getElementById('results');
            const list = document.getElementById('chapterList');

            chapters.forEach((chapter, index) => {
                const li = document.createElement('li');
                li.className = 'chapter-item';

                const label = document.createElement('span');
                label.textContent = `${index + 1}. ${chapter.title}`;

                const btn = document.createElement('button');
                btn.className = 'download-btn';
                btn.textContent = 'Download';
                btn.addEventListener('click', () => downloadChapter(title, chapter, btn));

                li.appendChild(label);
                li.appendChild(btn);
                list.appendChild(li);
            });

            resultsDiv.style.display = 'block';
        }

        async function downloadChapter(mangaTitle, chapter, btn) {
            if (typeof JSZip === 'undefined') {
                showStatus('Error: the ZIP library failed to load. Check your connection and reload the page.', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Starting...';

            try {
                // 1. Ask the Worker for this chapter's page images
                const res = await fetch(`${PROXY_API_URL}/images`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: chapter.url })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || !data.success) {
                    throw new Error(data.error || `Server Error: ${res.status}`);
                }
                const images = data.images;

                // 2. Download the images (a few at a time) through the Worker
                const blobs = new Array(images.length);
                let next = 0, done = 0;
                btn.textContent = `0/${images.length}`;

                async function runner() {
                    while (true) {
                        const i = next++;
                        if (i >= images.length) return;
                        const r = await fetch(`${PROXY_API_URL}/img?u=${encodeURIComponent(images[i])}`);
                        if (!r.ok) throw new Error(`Page ${i + 1} failed (status ${r.status})`);
                        blobs[i] = await r.blob();
                        done++;
                        btn.textContent = `${done}/${images.length}`;
                    }
                }
                await Promise.all(Array.from({ length: PARALLEL_IMAGES }, runner));

                // 3. Pack into a ZIP and save it
                btn.textContent = 'Zipping...';
                const zip = new JSZip();
                blobs.forEach((blob, i) => {
                    const ext = (images[i].match(/\.(jpe?g|png|webp|avif)(?:\?|$)/i) || [, 'jpg'])[1].toLowerCase();
                    zip.file(String(i + 1).padStart(3, '0') + '.' + ext, blob);
                });
                const zipBlob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });

                const safe = s => s.replace(/[\\/:*?"<>|]+/g, '').trim();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(zipBlob);
                a.download = `${safe(mangaTitle)} - ${safe(chapter.title)}.zip`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 60000);

                btn.textContent = 'Done ✓';
                showStatus(`Downloaded ${chapter.title} (${images.length} pages)`, 'success');
            } catch (err) {
                console.error(err);
                btn.textContent = 'Retry';
                showStatus(`Download failed: ${err.message}`, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = type;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
